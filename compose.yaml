name: procureflow-lab
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: procureflow
      POSTGRES_USER: lab_bootstrap
      POSTGRES_PASSWORD: local-bootstrap-only
    ports:
      - "127.0.0.1:${PG_PORT:-55438}:5432"
    volumes:
      - procure_data:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_bootstrap -d procureflow"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [classroom]
  app:
    build: .
    profiles: [full]
    environment:
      APP_BIND: 0.0.0.0
      DB_URL: jdbc:postgresql://db:5432/procureflow
      DB_USER: procure_app
      DB_PASSWORD: local-classroom-db
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:-Manager-lab-2026!}
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:18080"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 256
    networks: [classroom]
networks:
  classroom:
    driver: bridge
    internal: true
volumes:
  procure_data:

server:
  address: ${APP_BIND:127.0.0.1}
  port: ${APP_PORT:18080}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 1MB
spring:
  application:
    name: procureflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55438/procureflow}
    username: ${DB_USER:procure_app}
    password: ${DB_PASSWORD:local-classroom-db}
    hikari:
      maximum-pool-size: 8
      connection-init-sql: SET statement_timeout = '5s'
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      enabled: false
lab:
  seed: ${LAB_SEED:true}
  manager-password: ${MANAGER_PASSWORD:Manager-lab-2026!}
  worker-delay-ms: ${WORKER_DELAY_MS:2000}
logging:
  level:
    root: INFO
